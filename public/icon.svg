<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Rainy Night Convenience Store">
  <defs>
    <!-- night sky, same blue family as the scene fog -->
    <linearGradient id="night" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0d1626"/>
      <stop offset="0.5" stop-color="#121e35"/>
      <stop offset="1" stop-color="#1d2a47"/>
    </linearGradient>

    <!-- shopfront glow -->
    <linearGradient id="glass" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#fff6e2"/>
      <stop offset="0.5" stop-color="#ffe3b4"/>
      <stop offset="1" stop-color="#f3bd6c"/>
    </linearGradient>

    <!-- signage blue -->
    <linearGradient id="sign" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#2559c4"/>
      <stop offset="0.55" stop-color="#3a7ef2"/>
      <stop offset="1" stop-color="#2f6fe0"/>
    </linearGradient>

    <!-- wet ground reflection, fading down -->
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf85" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#e8a95f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e8a95f" stop-opacity="0"/>
    </linearGradient>

    <!-- warm halo hugging the glass -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#ffcf85" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffcf85" stop-opacity="0"/>
    </radialGradient>

    <filter id="bloom" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#night)"/>

    <!-- rain, spread evenly and kept clear of the signage -->
    <g stroke="#93b3da" stroke-linecap="round" opacity="0.4">
      <line x1="66"  y1="44"  x2="44"  y2="118" stroke-width="6"/>
      <line x1="128" y1="26"  x2="104" y2="94"  stroke-width="4"/>
      <line x1="196" y1="40"  x2="178" y2="96"  stroke-width="4"/>
      <line x1="316" y1="30"  x2="334" y2="90"  stroke-width="4"/>
      <line x1="388" y1="46"  x2="410" y2="116" stroke-width="6"/>
      <line x1="452" y1="34"  x2="474" y2="104" stroke-width="4"/>
      <line x1="40"  y1="176" x2="20"  y2="244" stroke-width="5"/>
      <line x1="486" y1="186" x2="504" y2="248" stroke-width="5"/>
    </g>

    <!-- pavement -->
    <rect x="0" y="352" width="512" height="160" fill="#0a1120"/>
    <rect x="0" y="348" width="512" height="6" fill="#2b3a55" opacity="0.85"/>

    <!-- warm halo around the shopfront -->
    <ellipse cx="256" cy="300" rx="230" ry="180" fill="url(#halo)"/>

    <!-- wet reflection under the store -->
    <rect x="112" y="356" width="288" height="120" fill="url(#pool)"/>

    <!-- the store -->
    <!-- signage band, lit -->
    <g filter="url(#bloom)">
      <rect x="86" y="106" width="340" height="74" rx="12" fill="url(#sign)"/>
    </g>
    <!-- inner bevel so the sign reads as a real lightbox -->
    <rect x="94" y="114" width="324" height="58" rx="8" fill="none" stroke="#8ab4ff" stroke-opacity="0.35" stroke-width="2"/>

    <!-- abstract wordmarks -->
    <g fill="#eff6ff" opacity="0.96">
      <rect x="116" y="132" width="48" height="22" rx="5"/>
      <rect x="176" y="132" width="48" height="22" rx="5"/>
      <rect x="236" y="132" width="48" height="22" rx="5"/>
    </g>
    <!-- 24H pill -->
    <rect x="316" y="130" width="80" height="26" rx="13" fill="#ff9d4d"/>
    <g fill="#3a2408" opacity="0.85">
      <rect x="330" y="139" width="12" height="8" rx="2"/>
      <rect x="347" y="139" width="12" height="8" rx="2"/>
      <rect x="364" y="139" width="12" height="8" rx="2"/>
    </g>

    <!-- awning: the striped canopy that says "convenience store" -->
    <rect x="80" y="180" width="352" height="30" rx="7" fill="#232e46"/>
    <g fill="#151d30" opacity="0.85">
      <rect x="80" y="196" width="352" height="9" rx="3"/>
    </g>
    <g fill="#5b6b8c" opacity="0.5">
      <rect x="96"  y="184" width="26" height="12" rx="4"/>
      <rect x="150" y="184" width="26" height="12" rx="4"/>
      <rect x="204" y="184" width="26" height="12" rx="4"/>
      <rect x="258" y="184" width="26" height="12" rx="4"/>
      <rect x="312" y="184" width="26" height="12" rx="4"/>
      <rect x="366" y="184" width="26" height="12" rx="4"/>
    </g>

    <!-- glass front -->
    <rect x="104" y="210" width="304" height="142" rx="8" fill="url(#glass)"/>
    <!-- interior warmth gradient toward the back -->
    <rect x="104" y="210" width="304" height="26" rx="8" fill="#fff9ec" opacity="0.55"/>

    <!-- shelving: rows of coloured goods, muted to match the scene palette -->
    <g opacity="0.78">
      <!-- left bay -->
      <rect x="118" y="246" width="14" height="20" rx="3" fill="#c98f5a"/>
      <rect x="136" y="246" width="14" height="20" rx="3" fill="#8a9e6a"/>
      <rect x="154" y="246" width="14" height="20" rx="3" fill="#d8a8b0"/>
      <rect x="118" y="276" width="14" height="20" rx="3" fill="#7a9db8"/>
      <rect x="136" y="276" width="14" height="20" rx="3" fill="#d8b26a"/>
      <rect x="154" y="276" width="14" height="20" rx="3" fill="#b0574e"/>
      <rect x="118" y="306" width="14" height="20" rx="3" fill="#e8e2d4"/>
      <rect x="136" y="306" width="14" height="20" rx="3" fill="#9a8e78"/>
      <rect x="154" y="306" width="14" height="20" rx="3" fill="#6e88a0"/>
      <!-- right bay -->
      <rect x="336" y="246" width="14" height="20" rx="3" fill="#cfa070"/>
      <rect x="354" y="246" width="14" height="20" rx="3" fill="#7f9a8a"/>
      <rect x="372" y="246" width="14" height="20" rx="3" fill="#d4c08a"/>
      <rect x="336" y="276" width="14" height="20" rx="3" fill="#5f7a8a"/>
      <rect x="354" y="276" width="14" height="20" rx="3" fill="#b8988a"/>
      <rect x="372" y="276" width="14" height="20" rx="3" fill="#c4785a"/>
      <rect x="336" y="306" width="14" height="20" rx="3" fill="#8a9e6a"/>
      <rect x="354" y="306" width="14" height="20" rx="3" fill="#d8a8b0"/>
      <rect x="372" y="306" width="14" height="20" rx="3" fill="#a8b88a"/>
    </g>

    <!-- mullions framing the door bay -->
    <rect x="200" y="210" width="6" height="142" fill="#c9913f" opacity="0.55"/>
    <rect x="306" y="210" width="6" height="142" fill="#c9913f" opacity="0.55"/>

    <!-- sliding door: brighter, warmest spot in the image -->
    <rect x="212" y="238" width="88" height="114" rx="6" fill="#ffdb9e" opacity="0.72"/>
    <rect x="256" y="238" width="4" height="114" fill="#d9a154" opacity="0.7"/>

    <!-- base plinth -->
    <rect x="88" y="352" width="336" height="18" rx="5" fill="#1f2a44"/>
    <rect x="88" y="348" width="336" height="6" rx="3" fill="#2f3d5e"/>
  </g>
</svg>
